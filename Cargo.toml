[workspace]
members = ["core", "server"]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
authors = ["Konstantin Pavlov"]
repository = "https://github.com/kpavlov/spec17"
homepage = "https://spec17.dev"
license-file = "LICENSE"
keywords = ["spec-driven", "requirements", "traceability", "mcp", "cli"]
categories = ["development-tools", "command-line-utilities"]

[profile.release]
opt-level = "s"
lto = true
strip = true
