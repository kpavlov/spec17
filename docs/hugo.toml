baseURL = "https://spec17.dev/"
title = "spec17"
disableKinds = ["section", "taxonomy", "term", "rss"]

[params]
  gtm = "GTM-MTTQ6B2P" # (NFR-19) Google Tag Manager container; loaded only after consent

[services.googleAnalytics]
  id = "G-GQXY8SX524" # Hugo's embedded snippet; held back until consent (layouts/all.html, static/consent.js)

[privacy.googleAnalytics]
  respectDoNotTrack = false # the banner's explicit choice decides, for the snippet and Tag Manager alike

[module.hugoVersion]
  min = "0.146.0" # layouts/all.html

[markup.highlight]
  noClasses = false # CSS classes, coloured by static/syntax.css from the shared tokens

[markup.goldmark.renderer]
  unsafe = true # raw HTML in markdown (our own content only)

[outputFormats.llms]
  baseName = "llms"
  mediaType = "text/plain"
  isPlainText = true
  notAlternative = true

[outputFormats.llmsfull]
  baseName = "llms-full"
  mediaType = "text/plain"
  isPlainText = true
  notAlternative = true

[outputFormats.markdown] # per-page Markdown for agents: /quickstart/ -> /quickstart.md
  mediaType = "text/markdown"
  isPlainText = true
  notAlternative = true
  ugly = true

[outputs]
  home = ["html", "json", "llms", "llmsfull"] # json: index.json for search.js
  page = ["html", "markdown"]
