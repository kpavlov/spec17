[package]
name = "spec17-core"
version.workspace = true
edition.workspace = true
description = "Deterministic spec-driven-development evidence: requirement IDs vs tests and code citations. Evidence, not truth."
authors.workspace = true
repository.workspace = true
readme = "../README.md"
keywords.workspace = true
categories.workspace = true

[dependencies]
ignore = "0.4"
indexmap = { version = "2", features = ["serde"] }
regex = "1"
schemars = { version = "1", features = ["indexmap2"] }
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
toml = "1"
walkdir = "2"
