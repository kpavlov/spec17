# How a requirement line looks in a spec. To accept a new spec format, edit these patterns; no Rust change.
# Regexes are TOML literal strings ('...'): write them as-is, no escaping. Use non-capturing groups (?:...) except for metadata values.
# Write word boundaries as (?-u:\b): requirement words are ASCII, and a Unicode \b is slow on lines with non-ASCII text.
#
#   id           requirement ID rules, tried together (leftmost match wins, so order rules that share a start from long to short)
#   not_id       whole well-known tokens that look like IDs, never requirements (`UTF-8`, `ISO-8601`, `TLS-1.3`); `HTTP-01` stays an ID
#   level        the level of a bullet or table row, on its first line
#   block_level  the level of a heading or paragraph block, on any of its lines (EARS `shall` in lower case too)
#   done         a check mark: a hint that the requirement is done
#   priority     priority hints, first matching rule wins; capture group 1 is the value
#   effort       effort hints, first matching rule wins; capture group 1 is the value
#   line         what opens a one-line requirement before the ID: a bullet (wraps until a blank line) or a table row
#   block        what opens a block requirement before the ID: a heading (runs to the next heading), an OpenSpec
#                `### Requirement: ID` heading or a `**ID**` paragraph
#   removed      a section heading whose requirements are retired (OpenSpec `## REMOVED Requirements`)
#   unnamed      a requirement heading without an ID (OpenSpec, Kiro): reported, not counted

id = [
    '[A-Z][A-Z0-9]{1,9}-\d{1,5}(?:\.\d{1,4})*', # ABC-12, REQ-0001, FR-001, AC-1.2
    '[A-Z][A-Z0-9]{1,9}_\d{1,5}(?:\.\d{1,4})*', # REQ_001, REQ_001.2
]
not_id = [
    'UTF-\d{1,2}', 'UCS-\d', 'ISO-\d{3,5}', 'IEC-\d{3,5}', 'SHA-\d{1,3}', 'RFC-\d{3,4}', 'TLS-1\.\d', 'SSL-\d(?:\.\d)?',
    'HTTP-[123](?:\.\d)?', 'CVE-\d{4}', 'CWE-\d{1,4}', 'PEP-\d{1,4}', 'JSR-\d{2,3}', 'JEP-\d{3}', 'ECMA-\d{3}', 'IEEE-\d{3,4}', 'COVID-19',
]
level = '(?-u:\b)(?:MUST|SHOULD|MAY|SHALL)(?-u:\b)'
block_level = '(?-u:\b)(?:MUST|SHOULD|MAY|SHALL|shall)(?-u:\b)'
done = '[✅✔☑✳]\x{FE0F}?'
priority = [
    '(?i)(?:^|\s)[\[(]priority:\s*(P[0-9]+)[\])]',
    # case-sensitive and bracketed: p95 latency, (p95) and P2P are prose, not hints
    '(?:^|\s)[\[(](P[0-9]+)[\])]',
]
effort = [
    '(?i)(?:^|\s)\((?:effort|size|estimate):\s*([^()\[\]]+?)\s*\)',
    '(?i)(?:^|\s)\[(?:effort|size|estimate):\s*([^()\[\]]+?)\s*\]',
    # upper case and after whitespace: requirement(s), file(s) and a code-quoted `[M]` are not sizes
    '(?:^|\s)[\[(](XXXS|XXS|XS|S|M|L|XL|XXL|XXXL)[\])]',
]
line = ['(?:[-*+]|\d+[.)])\s+', '\|\s*']
block = ['#{1,6}\s+Requirement:\s*', '#{1,6}\s+', '\*\*']
removed = '^#{1,2}\s+REMOVED\b'
unnamed = '^#{1,6}\s+Requirement\b'
