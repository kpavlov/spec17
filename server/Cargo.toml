[package]
name = "spec17"
version.workspace = true
edition.workspace = true
description = "CLI, MCP server and web dashboard for spec-driven-development evidence."
authors.workspace = true
repository.workspace = true
license-file.workspace = true
homepage.workspace = true
readme = "../README.md"
keywords.workspace = true
categories.workspace = true

[dependencies]
spec17-core = { path = "../core" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
yaml_serde = "0.10"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tokio-util = "0.7"
tower-http = { version = "0.7", features = ["compression-gzip"] }
rust-embed = "8"
mime_guess = "2"
rmcp = { version = "3.10", features = ["server", "macros", "transport-io", "transport-streamable-http-server"] }
schemars = "1"
reqwest = { version = "0.13", default-features = false }

[dev-dependencies]
http-body-util = "0.1"
tokio = { version = "1", features = ["process"] }
tower = { version = "0.5", features = ["util"] }
